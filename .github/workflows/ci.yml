name: Continuous Integration

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master, vivek-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Lint & Automated Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite
        env:
          NODE_ENV: test
          PORT: 5001
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long-key
        run: npm test

  frontend-ci:
    name: Frontend (Lint & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Build Frontend for Production
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1
          VITE_SOCKET_URL: http://localhost:5000
        run: npm run build

  ci-summary:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Evaluate Workflow Results
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "CI validation failed. Please review the failed job logs above."
            exit 1
          fi
          echo "All backend and frontend CI checks passed successfully!"
