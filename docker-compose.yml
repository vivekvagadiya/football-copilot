version: '3.8'

services:
  # Frontend Application Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # 1. Redis Cache Service
  redis:
    image: redis:alpine
    container_name: football_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: football_qdrant
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - ./backend/qdrant_storage:/qdrant/storage:z
    restart: always

  # 3. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: football_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

volumes:
  frontend_node_modules:
